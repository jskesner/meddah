[project]
name = "meddah"
version = "0.1.0"
description = "Meddah: The Universal Story Engine — tabletop-agnostic Ruleset VM, MUD, and VTT backend"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.115",
    "import-linter>=2.1",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["app/ruleset_vm", "app/mud_parser"]
include = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "zero_ai: tests guaranteed to run deterministically with AI_PROVIDER=none and zero LLM calls",
    "perf: performance budget and latency benchmark tests",
    "conformance: golden-file scenario tests across the 7 conformance rulesets",
]
