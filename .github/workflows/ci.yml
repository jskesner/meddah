name: Meddah CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repository & Documentation Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required root & governance files exist
        run: |
          for required in LICENSE README.md ROADMAP.md CHANGELOG.md .gitignore .env.example docs/CONTRIBUTING.md; do
            if [ ! -f "$required" ]; then
              echo "Missing required file: $required"
              exit 1
            fi
          done

      - name: Verify no local .env files are tracked in git
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "Forbidden .env secret file tracked in repository!"
            exit 1
          fi

      - name: Verify design docs & ADRs contain no local host file URIs
        run: |
          if grep -rn 'file:///' docs/design/ docs/adr/; then
            echo "Found non-portable file:/// URI inside docs/"
            exit 1
          fi

  backend-quality:
    name: Backend Quality, Linters & Zero-AI Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python & sync dependencies
        run: uv sync --directory backend --frozen

      - name: Check Python formatting (ruff format)
        run: uv run --directory backend ruff format --check app tests ../tools

      - name: Check Python lints (ruff check)
        run: uv run --directory backend ruff check app tests ../tools

      - name: Run static type checking (pyright)
        run: uv run --directory backend pyright

      - name: Verify Zero-Assumption Agnosticism (Golden Rule #1)
        run: uv run --directory backend python ../tools/lint_agnosticism.py

      - name: Verify Modularity & RAW Defaults (Golden Rule #4)
        run: uv run --directory backend python ../tools/lint_modularity.py

      - name: Enforce layer boundary contracts (import-linter)
        run: uv run --directory backend lint-imports

      - name: Verify JSON Schemas match Pydantic models
        run: uv run --directory backend python ../tools/generate_types.py --check

      - name: Verify ROADMAP.md structure & links
        run: uv run --directory backend python ../tools/roadmap.py --check

      - name: Run Zero-AI Deterministic Test Suite
        run: uv run --directory backend pytest -m zero_ai

      - name: Run Full Backend Test Suite
        run: uv run --directory backend pytest
